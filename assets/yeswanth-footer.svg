<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="ysf-title ysf-desc">
  <title id="ysf-title">Build thoughtfully. Keep learning.</title>
  <desc id="ysf-desc">Minimal burgundy footer with a fine animated line and small orbital detail.</desc>
  <defs>
    <linearGradient id="ysf-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="ysf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="ysf-glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect width="1200" height="110" rx="14" fill="url(#ysf-bg)"/>
  <path d="M30 28H1170" stroke="#C77B9B" stroke-opacity="0.14"/>
  <path d="M30 82H1170" stroke="#C77B9B" stroke-opacity="0.14"/>
  <path d="M40 55H1160" stroke="url(#ysf-line)" stroke-width="2" filter="url(#ysf-glow)"/>
  <path d="M40 55H1160" stroke="url(#ysf-line)" stroke-width="1.2" stroke-dasharray="30 18">
    <animate attributeName="stroke-dashoffset" values="0;-192" dur="10s" repeatCount="indefinite"/>
  </path>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="49" fill="#F8F0F3" font-size="14" letter-spacing="3">BUILD THOUGHTFULLY</text>
    <text x="600" y="70" fill="#C77B9B" font-size="10" letter-spacing="3">KEEP LEARNING  ·  KEEP SHIPPING</text>
  </g>
  <g fill="none" stroke="#E5B5C7" stroke-opacity="0.6">
    <circle cx="66" cy="55" r="10"/>
    <circle cx="66" cy="55" r="3" fill="#E5B5C7"/>
    <circle cx="1134" cy="55" r="10"/>
    <circle cx="1134" cy="55" r="3" fill="#E5B5C7"/>
  </g>
</svg>
