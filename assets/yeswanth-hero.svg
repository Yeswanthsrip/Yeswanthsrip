<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="ys-title ys-desc">
  <title id="ys-title">Yeswanth Sri Pichhikala — Software Developer</title>
  <desc id="ys-desc">A cinematic burgundy and ivory developer banner with subtle animated gradients, a technical grid, orbital geometry, and a glowing underline.</desc>
  <defs>
    <linearGradient id="ys-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.58" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="ys-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.08"/>
      <stop offset="0.48" stop-color="#C77B9B" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0.06"/>
      <animate attributeName="x1" values="-0.5;0;0.5" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;1;1.5" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ys-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.52" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="ys-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#E5B5C7" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <radialGradient id="ys-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <filter id="ys-soft-glow" x="-40%" y="-400%" width="180%" height="900%">
      <feGaussianBlur stdDeviation="4" result="ys-blur"/>
      <feMerge><feMergeNode in="ys-blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="ys-fade-mask">
      <linearGradient id="ys-mask-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="white"/>
        <stop offset="0.78" stop-color="white"/>
        <stop offset="1" stop-color="#777"/>
      </linearGradient>
      <rect width="1200" height="390" fill="url(#ys-mask-grad)"/>
    </mask>
  </defs>
  <!-- Static backdrop remains complete when SVG animation is unsupported. -->
  <rect width="1200" height="390" rx="20" fill="url(#ys-bg)"/>
  <rect width="1200" height="390" rx="20" fill="url(#ys-grid)"/>
  <ellipse cx="1000" cy="190" rx="300" ry="260" fill="url(#ys-orb)"/>
  <path d="M760 0V390M794 0V390M828 0V390M862 0V390M896 0V390M930 0V390M964 0V390M998 0V390M1032 0V390M1066 0V390M1100 0V390M1134 0V390M1168 0V390" stroke="#E5B5C7" stroke-opacity="0.045"/>
  <g fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.55">
    <ellipse cx="1010" cy="185" rx="158" ry="70" transform="rotate(-28 1010 185)"/>
    <ellipse cx="1010" cy="185" rx="158" ry="70" transform="rotate(42 1010 185)" stroke-opacity="0.25"/>
    <circle cx="1010" cy="185" r="92" stroke-dasharray="2 10" stroke-opacity="0.42"/>
    <circle cx="1120" cy="110" r="5" fill="#E5B5C7" stroke="none">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="888" cy="245" r="3" fill="#C77B9B" stroke="none"/>
    <circle cx="1065" cy="270" r="4" fill="#E5B5C7" stroke="none"/>
  </g>
  <path d="M0 324 C190 300 280 360 470 326 S760 290 930 323 S1110 355 1200 312" fill="none" stroke="url(#ys-glow)" stroke-width="1.2" mask="url(#ys-fade-mask)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="76" y="76" font-size="13" letter-spacing="4" fill="#C77B9B">DEVELOPER PROFILE  /  2027</text>
    <path d="M76 99H122" stroke="#C77B9B" stroke-width="2"/>
    <text x="72" y="169" font-size="48" font-weight="700" letter-spacing="-1.5" fill="#F8F0F3">Yeswanth Sri</text>
    <text x="72" y="224" font-size="48" font-weight="700" letter-spacing="-1.5" fill="#E5B5C7">Pichhikala.</text>
    <text x="76" y="267" font-size="17" letter-spacing="1.2" fill="#F8F0F3">SOFTWARE DEVELOPER  ·  JAVA  ·  FULL-STACK</text>
    <path d="M76 292H510" stroke="#701A3D" stroke-width="5" stroke-linecap="round"/>
    <path d="M76 292H510" stroke="url(#ys-rule)" stroke-width="3" stroke-linecap="round" filter="url(#ys-soft-glow)">
      <animate attributeName="stroke-dasharray" values="0 434;434 0;0 434" dur="7s" repeatCount="indefinite"/>
    </path>
    <text x="76" y="344" font-size="12" letter-spacing="2.4" fill="#C77B9B">BUILD THOUGHTFULLY. KEEP LEARNING.</text>
  </g>
  <path d="M1135 40h24M1147 28v24" stroke="#E5B5C7" stroke-opacity="0.55"/>
  <circle cx="1150" cy="345" r="2" fill="#E5B5C7"/>
</svg>
